services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wafer
      POSTGRES_PASSWORD: wafer
      POSTGRES_DB: waferdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wafer -d waferdb"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://wafer:wafer@db:5432/waferdb
      SEED_DEMO: "true"   # 首次启动注入演示数据，便于开箱体验
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
