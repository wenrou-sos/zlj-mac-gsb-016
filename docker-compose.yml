services:
  db:
    image: postgres:16-alpine
    container_name: wafermap-db
    environment:
      POSTGRES_USER: wafer
      POSTGRES_PASSWORD: wafer_pwd
      POSTGRES_DB: wafermap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wafer -d wafermap"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: wafermap-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://wafer:wafer_pwd@db:5432/wafermap
      SEED_DEMO: "1"
      CLUSTER_EPS: "30"
      CLUSTER_MIN_SAMPLES: "5"
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: wafermap-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
